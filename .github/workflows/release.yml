name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Serialize the entire release pipeline, including retries. Never cancel a deploy.
concurrency:
  group: silo-production
  cancel-in-progress: false
  # GitHub supports queue:max; actionlint 1.7.12 predates this property.
  queue: max

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Require a version tag
        id: tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo '::error::Release tags must be vX.Y.Z'
            exit 1
          }
          echo "version=${RELEASE_VERSION#v}" >> "$GITHUB_OUTPUT"

  verify:
    needs: version
    uses: ./.github/workflows/checks.yml

  desktop:
    needs: [version, verify]
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  build:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        id: name
        run: |
          repo=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$repo/server" >> "$GITHUB_OUTPUT"
      - name: Build and publish server
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=silo-server
          cache-to: type=gha,scope=silo-server,mode=max
      - name: Check the published image before deployment
        env:
          SERVER_IMAGE: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          docker run -d --name silo-release-check --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /data/db:rw,uid=10001,gid=10001,mode=0700,size=64m \
            -p 127.0.0.1:8787:8787 "$SERVER_IMAGE"
          trap 'docker logs silo-release-check; docker rm -f silo-release-check' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8787/health | grep -q '"status":"ok"'; then
              echo "Published image healthy after $attempt attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo '::error::Published image did not become healthy'
          exit 1

  deploy:
    needs: [build, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ vars.DOMAIN || 'silo.warpunit.com' }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH and verify HTTPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_USER: ${{ vars.SSH_USER || 'silodev' }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          DOMAIN: ${{ vars.DOMAIN || 'silo.warpunit.com' }}
          SILO_UID: ${{ vars.SILO_UID || '10001' }}
          SILO_GID: ${{ vars.SILO_GID || '10001' }}
          SERVER_PORT: ${{ vars.SERVER_PORT || '8787' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_IMAGE: ${{ needs.build.outputs.image }}
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: deployment/deploy-ssh.sh

  release:
    needs: [build, deploy, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v6
        with:
          pattern: Silo-desktop-*
          path: dist
          merge-multiple: true
      - name: Publish desktop packages and standalone CLI installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          SERVER_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          assets=()
          for platform in linux-x64 macos-arm64 macos-x64; do
            assets+=("dist/Silo-desktop-$platform.zip" "dist/silo-$platform")
          done
          for asset in "${assets[@]}"; do test -s "$asset"; done

          # shellcheck disable=SC2016
          printf 'Deployed silo-server from commit `%s`.\n\nContainer image: `%s`\n' \
            "$RELEASE_SHA" "$SERVER_IMAGE" > "$RUNNER_TEMP/release-notes.md"
          printf '\nThe desktop app includes the Silo CLI and can set up a vault on first launch. See the [installation instructions](https://github.com/%s/blob/%s/README.md#version-releases-and-updates).\n' \
            "$GH_REPO" "$RELEASE_VERSION" >> "$RUNNER_TEMP/release-notes.md"
          printf '\n[Standalone CLI installer](https://github.com/%s/releases/download/%s/install.sh) (Linux x64 and macOS).\n' \
            "$GH_REPO" "$RELEASE_VERSION" >> "$RUNNER_TEMP/release-notes.md"

          if ! gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release create "$RELEASE_VERSION" --draft --verify-tag --title "$RELEASE_VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          existing=$(gh release view "$RELEASE_VERSION" --json assets,isDraft)
          upload_missing() {
            local asset name state
            local missing=()
            for asset in "$@"; do
              name=${asset##*/}
              state=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .state' <<< "$existing")
              case "$state" in
                uploaded) continue ;;
                "") ;;
                *) gh release delete-asset "$RELEASE_VERSION" "$name" --yes ;;
              esac
              missing+=("$asset")
            done
            if (( ${#missing[@]} )); then
              gh release upload "$RELEASE_VERSION" "${missing[@]}"
            fi
          }
          upload_missing "${assets[@]}"
          # Read published digests so a retry uses the signed binaries already on the release.
          gh release view "$RELEASE_VERSION" --json assets | \
            python3 scripts/render-cli-installer.py "$GH_REPO" "$RELEASE_VERSION" > dist/install.sh
          if jq -e '.assets[] | select(.name == "install.sh" and .state == "uploaded")' <<< "$existing" >/dev/null; then
            gh release download "$RELEASE_VERSION" --pattern install.sh --output "$RUNNER_TEMP/published-install.sh"
            cmp dist/install.sh "$RUNNER_TEMP/published-install.sh"
          else
            upload_missing dist/install.sh
          fi
          edit_options=(--notes-file "$RUNNER_TEMP/release-notes.md")
          if jq -e '.isDraft' <<< "$existing" >/dev/null; then
            edit_options+=(--draft=false)
          fi
          gh release edit "$RELEASE_VERSION" "${edit_options[@]}"
