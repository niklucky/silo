[package]
name = "silo-cli"
description = "Command-line client for Silo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "silo"
path = "src/main.rs"

# Started by browsers for the extension (native messaging); see src/browser.rs.
[[bin]]
name = "silo-native-host"
path = "src/bin/native_host.rs"

[dependencies]
silo-agent.workspace = true
silo-core.workspace = true
anyhow.workspace = true
clap.workspace = true
csv.workspace = true
dotenvy.workspace = true
humantime.workspace = true
rand.workspace = true
rpassword.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
tempfile.workspace = true
zeroize.workspace = true
