[package]
name = "secret-cli"
description = "Command-line client for Secret"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "secret"
path = "src/main.rs"

# Started by browsers for the extension (native messaging); see src/browser.rs.
[[bin]]
name = "secret-native-host"
path = "src/bin/native_host.rs"

[dependencies]
secret-agent.workspace = true
secret-core.workspace = true
anyhow.workspace = true
clap.workspace = true
csv.workspace = true
dotenvy.workspace = true
humantime.workspace = true
rand.workspace = true
rpassword.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
